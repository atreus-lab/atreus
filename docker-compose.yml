version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VERIFIER_SERVICE_URL=http://verifier:8080
    depends_on:
      verifier:
        condition: service_healthy
    restart: unless-stopped

  verifier:
    build: ./verifier-service
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
